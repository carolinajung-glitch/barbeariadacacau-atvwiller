<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Barbeiros e serviços — Barbearia da Cacau</title></head>
<body>
<div class="layout">
  <aside class="menu" id="menu"></aside>
  <main>
    <div class="topo"><div><h1>Barbeiros e serviços</h1><p>Toda a equipe e o que cada barbeiro oferece.</p></div></div>

    <section class="painel">
      <div class="topo" style="margin-bottom:10px"><h2>Barbeiros</h2><button class="btn" id="novoB" type="button">Novo barbeiro</button></div>
      <div class="rolagem"><table>
        <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Especialidade</th><th></th></tr></thead>
        <tbody id="listaB"></tbody>
      </table></div>
    </section>

    <section class="painel">
      <div class="topo" style="margin-bottom:10px"><h2>Serviços</h2><button class="btn" id="novoS" type="button">Novo serviço</button></div>
      <div class="rolagem"><table>
        <thead><tr><th>Serviço</th><th>Preço</th><th>Duração</th><th>Barbeiro responsável</th><th></th></tr></thead>
        <tbody id="listaS"></tbody>
      </table></div>
    </section>
  </main>
</div>

<dialog id="dlgB">
  <form id="formB" novalidate>
    <h2 id="tituloB">Novo barbeiro</h2>
    <label for="bNome">Nome</label><input id="bNome" required>
    <label for="bCpf">CPF</label><input id="bCpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
    <p class="dica" id="dicaB"></p>
    <div class="linha-2">
      <div><label for="bTel">Telefone</label><input id="bTel" required placeholder="(48) 99999-0000"></div>
      <div><label for="bEsp">Especialidade</label><input id="bEsp"></div>
    </div>
    <div class="msg-erro" id="erroB" role="alert"></div>
    <div class="dialogo-acoes"><button class="btn sec" type="button" id="cancB">Cancelar</button><button class="btn" type="submit">Salvar barbeiro</button></div>
  </form>
</dialog>

<dialog id="dlgS">
  <form id="formS" novalidate>
    <h2 id="tituloS">Novo serviço</h2>
    <label for="sNome">Nome do serviço</label><input id="sNome" required>
    <div class="linha-2">
      <div><label for="sPreco">Preço (R$)</label><input id="sPreco" type="number" min="0" step="0.01" required></div>
      <div><label for="sDur">Duração (min)</label><input id="sDur" type="number" min="5" step="5" required></div>
    </div>
    <label for="sBarb">Barbeiro responsável</label>
    <select id="sBarb" required></select>
    <div class="msg-erro" id="erroS" role="alert"></div>
    <div class="dialogo-acoes"><button class="btn sec" type="button" id="cancS">Cancelar</button><button class="btn" type="submit">Salvar serviço</button></div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
let edB = null, edS = null, barbs = [], servs = [];

async function carregar() {
  barbs = await api('/api/barbeiros');
  servs = await api('/api/servicos');
  document.getElementById('listaB').innerHTML = barbs.length ? barbs.map((b) =>
    '<tr><td>' + esc(b.nome) + '</td><td>' + esc(b.cpf) + '</td><td>' + esc(b.telefone) + '</td><td>' + esc(b.especialidade || '—') +
    '</td><td class="acoes"><button class="btn sec mini" data-eb="' + b.id + '">Editar</button><button class="btn perigo mini" data-xb="' + b.id + '">Excluir</button></td></tr>').join('')
    : '<tr><td colspan="5" class="vazio">Nenhum barbeiro cadastrado.</td></tr>';
  document.getElementById('listaS').innerHTML = servs.length ? servs.map((s) =>
    '<tr><td>' + esc(s.nome) + '</td><td>' + dinheiro(s.preco) + '</td><td>' + s.duracao_min + ' min</td><td>' + esc(s.barbeiro) +
    '</td><td class="acoes"><button class="btn sec mini" data-es="' + s.id + '">Editar</button><button class="btn perigo mini" data-xs="' + s.id + '">Excluir</button></td></tr>').join('')
    : '<tr><td colspan="5" class="vazio">Nenhum serviço cadastrado.</td></tr>';
}

function abrirB(b) {
  edB = b ? b.id : null;
  tituloB.textContent = b ? 'Editar barbeiro' : 'Novo barbeiro';
  bNome.value = b ? b.nome : ''; bCpf.value = ''; bTel.value = b ? b.telefone : ''; bEsp.value = b ? b.especialidade || '' : '';
  dicaB.textContent = b ? 'Deixe em branco para manter o CPF atual (' + b.cpf + ').' : '';
  erroB.textContent = ''; dlgB.showModal();
}

function abrirS(s) {
  if (!barbs.length) return aviso('Cadastre um barbeiro antes de criar serviços.', true);
  edS = s ? s.id : null;
  tituloS.textContent = s ? 'Editar serviço' : 'Novo serviço';
  sNome.value = s ? s.nome : ''; sPreco.value = s ? s.preco : ''; sDur.value = s ? s.duracao_min : '';
  sBarb.innerHTML = '<option value="">Selecione…</option>' + barbs.map((b) => '<option value="' + b.id + '">' + esc(b.nome) + '</option>').join('');
  sBarb.value = s ? s.barbeiro_id : '';
  erroS.textContent = ''; dlgS.showModal();
}

if (iniciar('barbeiros.html')) {
  carregar().catch((e) => aviso(e.message, true));
  novoB.onclick = () => abrirB(null); novoS.onclick = () => abrirS(null);
  cancB.onclick = () => dlgB.close(); cancS.onclick = () => dlgS.close();

  document.querySelector('main').onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    try {
      if (d.eb) abrirB(barbs.find((x) => x.id == d.eb));
      if (d.es) abrirS(servs.find((x) => x.id == d.es));
      if (d.xb && confirm('Excluir este barbeiro?')) { await api('/api/barbeiros/' + d.xb, 'DELETE'); aviso('Barbeiro excluído.'); carregar(); }
      if (d.xs && confirm('Excluir este serviço?')) { await api('/api/servicos/' + d.xs, 'DELETE'); aviso('Serviço excluído.'); carregar(); }
    } catch (err) { aviso(err.message, true); }
  };

  formB.onsubmit = async (e) => {
    e.preventDefault();
    const corpo = { nome: bNome.value, cpf: bCpf.value, telefone: bTel.value, especialidade: bEsp.value };
    try {
      await api(edB ? '/api/barbeiros/' + edB : '/api/barbeiros', edB ? 'PUT' : 'POST', corpo);
      dlgB.close(); aviso('Barbeiro salvo.'); carregar();
    } catch (err) { erroB.textContent = err.message; }
  };

  formS.onsubmit = async (e) => {
    e.preventDefault();
    const corpo = { nome: sNome.value, preco: sPreco.value, duracao_min: sDur.value, barbeiro_id: sBarb.value };
    try {
      await api(edS ? '/api/servicos/' + edS : '/api/servicos', edS ? 'PUT' : 'POST', corpo);
      dlgS.close(); aviso('Serviço salvo.'); carregar();
    } catch (err) { erroS.textContent = err.message; }
  };
}
</script>
</body>
</html>
